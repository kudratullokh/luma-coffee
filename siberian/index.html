<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siberian каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#16211b);
  --hint:var(--tg-theme-hint-color,#78827c);
  --surface:var(--tg-theme-secondary-bg-color,#f1f3ef);
  --taiga:#1f4d3a; --taiga-ink:#1f4d3a; --on-taiga:#ffffff;
  --health:#3e7c59; --beauty:#b8436a; --parfum:#6b5ca5; --sport:#d9741f; --other:#7a7f73;
  --health-soft:rgba(62,124,89,.13); --beauty-soft:rgba(184,67,106,.12); --parfum-soft:rgba(107,92,165,.13);
  --sport-soft:rgba(217,116,31,.13); --other-soft:rgba(122,127,115,.14);
  --display:"Unbounded",system-ui,sans-serif; --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html.dark{--taiga:#2e6b51;--taiga-ink:#8fcfa9;--health:#74b892;--beauty:#e48aa9;--parfum:#ab9de6;--sport:#f0a35a;--other:#aeb2a6;
  --health-soft:rgba(110,190,145,.16);--beauty-soft:rgba(230,120,160,.15);--parfum-soft:rgba(160,145,225,.16);
  --sport-soft:rgba(240,150,70,.16);--other-soft:rgba(180,185,170,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--ui);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--taiga-ink);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:18px 0 6px}
h1{font:600 23px/1.15 var(--display);margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--hint);font-size:13px;margin:0}
.search{display:block;position:relative;margin:14px 0 10px}
.search input{width:100%;height:44px;border:0;border-radius:14px;background:var(--surface);color:var(--text);font:inherit;padding:0 14px 0 42px}
.search input::placeholder{color:var(--hint)}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;stroke:var(--hint)}
.promo{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 12px 12px 14px;margin:0 0 12px}
.promo p{margin:0;font-size:14px;line-height:1.35;flex:1}
.promo b{font-weight:600;color:var(--taiga-ink)}
.promo button{background:var(--taiga);color:var(--on-taiga);border-radius:11px;padding:9px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;background:var(--surface);font-size:14px;font-weight:500;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--taiga))}
.chip small{color:var(--hint);font-size:12px;font-weight:400}
.chip[aria-pressed=true]{background:var(--c,var(--taiga));color:var(--bg)}
.chip[data-cat=all][aria-pressed=true]{background:var(--taiga);color:#fff}
.chip[aria-pressed=true] i{background:currentColor}.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.series .chip{height:30px;font-size:13px;padding:0 11px;font-weight:400}
.series .chip[aria-pressed=true]{background:var(--text);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:4px 0 8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;min-width:0}
.label{filter:hue-rotate(var(--h,0deg));position:relative;aspect-ratio:1/1;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.label::after{content:"";position:absolute;inset:7px;border-radius:12px;border:1px solid var(--c);opacity:.32;pointer-events:none}
.label svg{width:42%;height:42%;stroke:var(--c);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.label .ser{position:absolute;left:15px;right:15px;top:13px;font-size:11.5px;line-height:1.25;color:var(--c);font-weight:500;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.label img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.name{margin:9px 2px 6px;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;text-align:left}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 6px;margin:auto 2px 0}
.row>span[data-ctl]{margin-left:auto}
.price{font:600 14.5px/1.15 var(--display);letter-spacing:-.01em;white-space:nowrap}
.price span,.cur{font:400 12px var(--ui);color:var(--hint);letter-spacing:0}
.pts{display:block;color:var(--hint);font-size:12px;margin-top:4px}
.add{flex:none;width:36px;height:36px;border-radius:50%;background:var(--taiga);color:var(--on-taiga);display:flex;align-items:center;justify-content:center}
.add svg,.step svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.step{flex:none;display:flex;align-items:center;height:36px;border-radius:18px;background:var(--taiga);color:var(--on-taiga)}
.step button{width:34px;height:36px;display:flex;align-items:center;justify-content:center}
.step b{min-width:16px;text-align:center;font-weight:600;font-size:14px}
.empty{text-align:center;color:var(--hint);padding:48px 12px}
footer{color:var(--hint);font-size:12px;padding:18px 0 8px;line-height:1.5}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -1px 0 rgba(0,0,0,.06)}
.bar button{width:100%;max-width:612px;margin:0 auto;display:block;height:50px;border-radius:14px;background:var(--taiga);color:var(--on-taiga);font-weight:600;font-size:15px}
.view{display:none}.view.on{display:block}
.cart h2{font:600 20px/1.2 var(--display);margin:18px 0 12px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface)}
.line .dot{flex:none;width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.line .dot svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.line .info{flex:1;min-width:0}
.line .info p{margin:0 0 3px;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line .info small{color:var(--hint);font-size:12.5px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;margin:18px 0 6px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:500;color:var(--hint)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note{color:var(--hint);font-size:12.5px;margin:6px 2px 0}
.sum{margin:16px 0 4px}
.sum div{display:flex;justify-content:space-between;padding:5px 2px;font-size:14px}
.sum .total{font:600 17px var(--display);padding-top:10px;margin-top:6px;border-top:1px solid var(--surface)}
.cb{background:var(--surface);border-radius:16px;padding:14px;margin:16px 0}
.cb p{margin:0 0 10px;font-size:14px;line-height:1.4}
.cb b{color:var(--taiga-ink);font-weight:600}
.meter{position:relative;height:8px;border-radius:4px;background:rgba(127,127,127,.18);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--taiga);border-radius:4px;transition:width .3s ease}
.ticks{position:relative;height:16px;font-size:11.5px;color:var(--hint);margin-top:6px}
.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:last-child{transform:none;right:0}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--bg);opacity:.9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:20}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:640px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(0);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(127,127,127,.35);margin:0 auto 14px}
.sheet .label{aspect-ratio:2/1}
.sheet h3{font-size:17px;line-height:1.3;font-weight:600;margin:14px 0 4px}
.sheet .meta{color:var(--hint);font-size:13px;margin:0 0 14px}
.sheet .row{margin:0 0 16px}
.sheet .price{font-size:20px}
.btns{display:flex;gap:10px}
.btns button{flex:1;height:48px;border-radius:14px;font-weight:600}
.primary{background:var(--taiga);color:var(--on-taiga)}
.ghost{background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:88%}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="view on" id="catalog">
    <header>
      <h1>Siberian каталог</h1>
      <p class="sub" id="sub">Маҳсулотлар юкланяпти…</p>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Номи ёки коди бўйича қидириш" autocomplete="off" aria-label="Қидириш">
    </label>
    <div class="promo" id="promo" hidden>
      <p>Бепул рўйхатдан ўтинг ва харидларга <b>15% гача кешбэк</b> олинг.</p>
      <button id="promoBtn">Рўйхатдан ўтиш</button>
    </div>
    <div class="chips" id="cats" role="toolbar" aria-label="Бўлимлар"></div>
    <div class="chips series" id="series" role="toolbar" aria-label="Сериялар" hidden></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Ҳеч нарса топилмади. Бошқа сўз билан қидириб кўринг.</p>
    <footer id="foot"></footer>
  </section>

  <section class="view cart" id="cart">
    <h2>Сават</h2>
    <div id="lines"></div>
    <div class="seg" role="group" aria-label="Етказиб бериш">
      <button id="rT" aria-pressed="true">Тошкент</button>
      <button id="rR" aria-pressed="false">Вилоят</button>
    </div>
    <p class="note" id="dnote"></p>
    <div class="sum" id="sum"></div>
    <div class="cb" id="cb"></div>
    <p class="note">Буюртмадан кейин консультант боғланиб, нарх ва етказишни тасдиқлайди.</p>
  </section>
</div>

<div class="bar" id="bar" hidden><button id="barBtn"></button></div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
const canSend = inTg && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id);
const params = new URLSearchParams(location.search);
const REF = params.get("ref") || "";
const CAT_ORDER = ["health", "beauty", "parfum", "sport", "other"];
const DELIVERY = {tashkent: {free: 300000, fee: 20000}, region: {free: 700000, fee: 30000}};
const LEVELS = [[30, 5], [50, 10], [100, 15]];
const ICONS = {
  health: '<path d="M12 21c0-6 0-9 0-11"/><path d="M12 13c-4.5 0-7-3-7-8 4.5 0 7 3 7 8Z"/><path d="M12 10c0-4 2.5-6.5 7-6.5 0 4.5-2.5 7-7 6.5Z"/>',
  beauty: '<path d="M12 3c3.5 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.8 6-11Z"/><path d="M9.5 15.5a2.6 2.6 0 0 0 2.5 2.4"/>',
  parfum: '<rect x="6" y="9" width="12" height="12" rx="3"/><path d="M10 9V6h4v3"/><path d="M9 4h6"/><path d="M9.5 14.5h5"/>',
  sport: '<path d="M13 3 6 13.5h5L10 21l8-11h-5.2L13 3Z"/>',
  other: '<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  capsule: '<rect x="3.5" y="9" width="17" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="m9.2 9.2 5.6 5.6"/>',
  cup: '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9Z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3c-1 1.2 1 2 0 3.5M12.5 3c-1 1.2 1 2 0 3.5"/>',
  box: '<path d="m4 8 8-4 8 4v8l-8 4-8-4V8Z"/><path d="m4 8 8 4 8-4M12 12v8"/>',
  tube: '<path d="M8 3h8v3l-1 1v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V7L8 6V3Z"/><path d="M10 11h4"/>',
  bottle: '<path d="M10 3h4v3l2 2v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-2V3Z"/><path d="M8 12h8"/>',
  jar: '<rect x="5" y="9" width="14" height="11" rx="3"/><path d="M6 9V6.5A1.5 1.5 0 0 1 7.5 5h9A1.5 1.5 0 0 1 18 6.5V9"/>',
  dropper: '<path d="M9 3h6M12 3v3"/><path d="M9.5 6h5l-.5 4h-4l-.5-4Z"/><path d="M10 10h4v8a2 2 0 0 1-4 0v-8Z"/>',
  shaker: '<path d="M7 8h10l-1.2 12H8.2L7 8Z"/><path d="M8 4h8v4H8z"/><path d="M7.6 13h8.8"/>',
  bar: '<rect x="3" y="8" width="18" height="8" rx="2"/><path d="M8 8v8M13 8v8"/>',
  gift: '<rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M3 9h18M12 9v11"/><path d="M12 9c-2-4-6-3-4.5-.5M12 9c2-4 6-3 4.5-.5"/>'
};
const FORMS = [
  [/набор|\bset\b/, "gift"], [/чай|\btea\b/, "cup"], [/\bbox\b|бокс/, "box"], [/батончик|мыло/, "bar"],
  [/зубная паста|паста|гель интимный|бальзам для губ|крем для рук|део-гель/, "tube"],
  [/шампун|кондиционер|для душа|для умывания|тоник|мицеллярн|ополаскиват|масло|сироп|флюид|молочко|пенка|эмульсия|дезодорант|пудра/, "bottle"],
  [/сыворотк|эссенц|концентрат|эпам/, "dropper"], [/крем|бальзам|маска|скраб|баттер|пилинг|гель/, "jar"],
  [/протеин|коктейль|напиток|bcaa|карнитин|шейкер/, "shaker"], [/парфюм|духи/, "parfum"],
  [/трав|botanic|мака|женьшень|гинкго|валериан|пустырник|ортилия|горечей|грибов/, "health"]
];
const DEFAULT_FORM = {health: "capsule", beauty: "beauty", parfum: "parfum", sport: "sport", other: "other"};
function form(p) { const n = (p.name + " " + (p.series || "")).toLowerCase(); const f = FORMS.find(([re]) => re.test(n)); return f ? f[1] : DEFAULT_FORM[p.category] || "other"; }
function hue(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return (Math.abs(h) % 29) - 14; }
let DATA = null, CATS = {}, byId = {};
let state = {cat: "all", series: "", q: "", view: "catalog", region: "tashkent"};
let cart = {};
try { cart = JSON.parse(localStorage.getItem("sw_cart_v1") || "{}") || {}; } catch (e) { cart = {}; }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("ru-RU").format(Math.round(n)).replace(/ /g, " ");
const pts = n => String(Math.round(n * 10) / 10).replace(".", ",");
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k] || ICONS.other}</svg>`;
const vars = c => `--c:var(--${c});--soft:var(--${c}-soft)`;
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
function save() { try { localStorage.setItem("sw_cart_v1", JSON.stringify(cart)); } catch (e) {} }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

function init() {
  if (inTg) {
    tg.ready(); tg.expand();
    document.documentElement.classList.toggle("dark", tg.colorScheme === "dark");
    tg.onEvent("themeChanged", () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark"));
    tg.MainButton.onClick(mainAction);
    tg.BackButton.onClick(() => show("catalog"));
  }
  if (REF) { $("#promo").hidden = false; $("#promoBtn").onclick = () => inTg ? tg.openLink(REF) : window.open(REF, "_blank"); }
  fetch("products.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
    DATA = d; CATS = d.categories || {};
    d.products.forEach(p => byId[p.id] = p);
    Object.keys(cart).forEach(id => { if (!byId[id]) delete cart[id]; });
    const date = (d.updated || "").split("-").reverse().join(".");
    $("#sub").textContent = `${d.products.length} та маҳсулот. Нархлар ${date} ҳолатига.`;
    $("#foot").textContent = `Мустақил консультант каталоги. Нархлар Siberian Wellness Ўзбекистон прайс-листидан олинган (${date}), ўзгариши мумкин.`;
    renderCats(); render(); updateMain();
  }).catch(() => { $("#sub").textContent = "Каталогни юклаб бўлмади. Интернетни текшириб, қайта очинг."; });
}

function list() {
  const q = state.q.trim().toLowerCase();
  return DATA.products.filter(p =>
    (state.cat === "all" || p.category === state.cat) &&
    (!state.series || p.series === state.series) &&
    (!q || p.name.toLowerCase().includes(q) || String(p.id).toLowerCase().includes(q) || (p.series || "").toLowerCase().includes(q)));
}

function renderCats() {
  const count = c => DATA.products.filter(p => p.category === c).length;
  const chips = [`<button class="chip" data-cat="all" aria-pressed="${state.cat === "all"}"><i></i>Ҳаммаси <small>${DATA.products.length}</small></button>`]
    .concat(CAT_ORDER.filter(c => CATS[c] && count(c)).map(c =>
      `<button class="chip" data-cat="${c}" style="${vars(c)}" aria-pressed="${state.cat === c}"><i></i>${esc(CATS[c])} <small>${count(c)}</small></button>`));
  $("#cats").innerHTML = chips.join("");
  const box = $("#series");
  if (state.cat === "all") { box.hidden = true; box.innerHTML = ""; return; }
  const names = [...new Set(DATA.products.filter(p => p.category === state.cat).map(p => p.series).filter(Boolean))];
  box.hidden = names.length < 2;
  box.innerHTML = [`<button class="chip" data-series="" aria-pressed="${!state.series}">Барча сериялар</button>`]
    .concat(names.map(s => `<button class="chip" data-series="${esc(s)}" aria-pressed="${state.series === s}">${esc(s)}</button>`)).join("");
}

function control(p) {
  const n = cart[p.id] || 0;
  if (!n) return `<button class="add" data-add="${esc(p.id)}" aria-label="Саватга қўшиш"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>`;
  return `<div class="step"><button data-dec="${esc(p.id)}" aria-label="Камайтириш"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><b>${n}</b><button data-add="${esc(p.id)}" aria-label="Кўпайтириш"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>`;
}

function tile(p) {
  const media = p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy">` : `<span class="ser">${esc(p.series || "")}</span>${icon(form(p))}`;
  return `<button class="label" style="${vars(p.category)};--h:${hue(p.series)}deg" data-open="${esc(p.id)}" aria-label="${esc(p.name)}">${media}</button>`;
}

function render() {
  if (!DATA) return;
  const items = list();
  $("#grid").innerHTML = items.map(p => `<article class="card">${tile(p)}
    <button class="name" data-open="${esc(p.id)}">${esc(p.name)}</button>
    <div class="row"><div><div class="price">${money(p.price)} <span>сўм</span></div><span class="pts">${pts(p.points)} балл</span></div><span data-ctl="${esc(p.id)}">${control(p)}</span></div></article>`).join("");
  $("#empty").hidden = items.length > 0;
}

function refreshControls(id) {
  document.querySelectorAll(`[data-ctl="${CSS.escape(id)}"]`).forEach(el => el.innerHTML = control(byId[id]));
}

function change(id, d) {
  const n = Math.max(0, Math.min(99, (cart[id] || 0) + d));
  if (n) cart[id] = n; else delete cart[id];
  save(); haptic(d > 0 ? "light" : "soft");
  refreshControls(id);
  if (state.view === "cart") renderCart();
  if ($("#sheetBg").classList.contains("on") && $("#sheet").dataset.id === id) openSheet(id);
  updateMain();
}

function totals() {
  let sum = 0, points = 0, count = 0;
  Object.entries(cart).forEach(([id, n]) => { const p = byId[id]; if (p) { sum += p.price * n; points += p.points * n; count += n; } });
  const rule = DELIVERY[state.region];
  const delivery = sum >= rule.free ? 0 : rule.fee;
  return {sum, points, count, delivery, total: sum + delivery, toFree: Math.max(0, rule.free - sum)};
}

function renderCart() {
  const ids = Object.keys(cart);
  if (!ids.length) {
    $("#lines").innerHTML = '<p class="empty">Сават бўш. Каталогдан маҳсулот қўшинг.</p>';
    $("#sum").innerHTML = ""; $("#cb").hidden = true; $("#dnote").textContent = ""; return;
  }
  $("#lines").innerHTML = ids.map(id => { const p = byId[id];
    return `<div class="line" style="${vars(p.category)}"><span class="dot">${icon(form(p))}</span>
      <div class="info"><p>${esc(p.name)}</p><small>${money(p.price)} сўм, ${pts(p.points)} балл</small></div>
      <span data-ctl="${esc(id)}">${control(p)}</span></div>`; }).join("");
  const t = totals();
  $("#dnote").textContent = t.delivery ? `Бепул етказишгача яна ${money(t.toFree)} сўм.` : "Етказиш бепул.";
  $("#sum").innerHTML = `<div><span>Маҳсулотлар (${t.count} та)</span><span>${money(t.sum)} сўм</span></div>
    <div><span>Етказиш</span><span>${t.delivery ? money(t.delivery) + " сўм" : "бепул"}</span></div>
    <div class="total"><span>Жами</span><span>${money(t.total)} сўм</span></div>`;
  const level = LEVELS.filter(([p]) => t.points >= p).pop();
  const next = LEVELS.find(([p]) => t.points < p);
  const pct = Math.min(100, t.points);
  $("#cb").hidden = false;
  $("#cb").innerHTML = `<p>Саватда <b>${pts(t.points)} балл</b>. ${level ? `Рўйхатдан ўтган мижоз бундай харид учун <b>${level[1]}% кешбэк</b> олади.` : "30 баллдан бошлаб рўйхатдан ўтган мижоз кешбэк олади."}
    ${next ? `${next[1]}% учун яна ${pts(next[0] - t.points)} балл.` : ""}</p>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i><b style="left:30%"></b><b style="left:50%"></b></div>
    <div class="ticks" aria-hidden="true"><span style="left:30%">5%</span><span style="left:50%">10%</span><span>15%</span></div>`;
}

function show(view) {
  state.view = view;
  $("#catalog").classList.toggle("on", view === "catalog");
  $("#cart").classList.toggle("on", view === "cart");
  if (view === "cart") renderCart();
  if (inTg) { view === "cart" ? tg.BackButton.show() : tg.BackButton.hide(); }
  window.scrollTo(0, 0);
  updateMain();
}

function updateMain() {
  const t = totals();
  let text = "", visible = false;
  if (state.view === "catalog" && t.count) { text = `Сават: ${t.count} та, ${money(t.sum)} сўм`; visible = true; }
  if (state.view === "cart" && t.count) { text = `Буюртма бериш · ${money(t.total)} сўм`; visible = true; }
  if (inTg) {
    if (visible) { tg.MainButton.setParams({text, color: "#1f4d3a", text_color: "#ffffff", is_visible: true, is_active: true}); }
    else tg.MainButton.hide();
  } else {
    $("#bar").hidden = !visible; $("#barBtn").textContent = text;
  }
}

function mainAction() {
  if (state.view === "catalog") { show("cart"); return; }
  const items = Object.entries(cart).map(([id, n]) => [id, n]);
  if (!items.length) return;
  if (!canSend) { toast("Буюртма бериш учун каталогни ботдаги «Каталог» тугмасидан очинг."); return; }
  const payload = JSON.stringify({t: "order", r: state.region, items});
  cart = {}; save();
  tg.sendData(payload);
}

function openSheet(id) {
  const p = byId[id]; if (!p) return;
  const sheet = $("#sheet"); sheet.dataset.id = id;
  sheet.innerHTML = `<div class="grab"></div>${tile(p).replace("data-open", "data-x")}
    <h3>${esc(p.name)}</h3><p class="meta">${esc(p.series || "")}${p.series ? ", " : ""}код ${esc(p.id)}</p>
    <div class="row"><div><div class="price">${money(p.price)} <span>сўм</span></div><span class="pts">${pts(p.points)} балл</span></div><span data-ctl="${esc(p.id)}">${control(p)}</span></div>
    <div class="btns">${canSend ? `<button class="ghost" data-ask="${esc(p.id)}">Консультантдан сўраш</button>` : ""}<button class="primary" data-close>${cart[id] ? "Тайёр" : "Саватга қўшиш"}</button></div>`;
  sheet.querySelector("[data-close]").onclick = () => { if (!cart[id]) change(id, 1); closeSheet(); };
  const ask = sheet.querySelector("[data-ask]");
  if (ask) ask.onclick = () => tg.sendData(JSON.stringify({t: "ask", id}));
  $("#sheetBg").classList.add("on");
}
function closeSheet() { $("#sheetBg").classList.remove("on"); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.cat) { state.cat = b.dataset.cat; state.series = ""; renderCats(); render(); window.scrollTo({top: 0}); return; }
  if ("series" in b.dataset) { state.series = b.dataset.series; renderCats(); render(); return; }
  if (b.dataset.add) { e.stopPropagation(); change(b.dataset.add, 1); return; }
  if (b.dataset.dec) { e.stopPropagation(); change(b.dataset.dec, -1); return; }
  if (b.dataset.open) { openSheet(b.dataset.open); return; }
});
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#barBtn").addEventListener("click", mainAction);
$("#rT").onclick = () => { state.region = "tashkent"; $("#rT").setAttribute("aria-pressed", "true"); $("#rR").setAttribute("aria-pressed", "false"); renderCart(); updateMain(); };
$("#rR").onclick = () => { state.region = "region"; $("#rR").setAttribute("aria-pressed", "true"); $("#rT").setAttribute("aria-pressed", "false"); renderCart(); updateMain(); };
init();
</script>
</body>
</html>
